name: ci

# Every push to main and every pull request. This package imports
# @foldrun/core by sibling path — ../foldrun-core/src — so the build checks
# out both repositories side by side, exactly the layout a developer's disk
# has, and installs both before the typecheck and the tests.
#
# Against core's main as well (FOL-92): foldrun-core's ci sends a
# `core-main` repository_dispatch when its main passes, a nightly schedule
# catches a dispatch that never came, and workflow_dispatch runs it by hand
# against any core ref. These runs test this repository's main against that
# core — the CLI once went red against core main while its own CI stayed
# green, because nothing re-ran it.
#
# The tests that need a real Postgres, Redis and KMS run here too (FOL-92):
# the services below are the images dev runs (foldrun-infra
# manifests/base/datastores.yaml, by digest), one set per job, so the two
# Node versions never share a database.
#
# Actions are pinned to full commit SHAs, with the tag in a comment, so a
# retagged action cannot change what runs here; Dependabot's github-actions
# entry (.github/dependabot.yml) keeps the pins moving.
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [core-main]
  schedule:
    - cron: "23 15 * * *"   # nightly, against core's main
  workflow_dispatch:
    inputs:
      core_ref:
        description: "foldrun-core ref to test against (empty: main)"
        required: false
        default: ""

permissions:
  contents: read

# One run per ref; a newer push/PR update cancels the older one (FOL-62, box runner).
# A run against core's main has its own group, so it never cancels a push's.
concurrency:
  group: ci-${{ github.ref }}${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && '-core' || '' }}
  cancel-in-progress: true

jobs:
  # The security gate every foldrun repo runs (.githooks/security.sh, synced
  # from foldrun-infra): secrets in the push and the tree, Semgrep, npm audit
  # and registry signatures, a CycloneDX SBOM kept as an artifact. No secrets
  # here, so a fork's pull request runs it too.
  security:
    # This repository's own changes: not re-run when only core moved.
    if: github.event_name != 'repository_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install (no scripts) — this repo and its nested apps
        run: for d in . */; do [ -f "$d/package-lock.json" ] && [ "$d" != node_modules/ ] && (cd "$d" && npm ci --ignore-scripts --no-audit --no-fund); done; true
      - name: security gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .githooks/security.sh "$BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('sbom/*.cdx.json') != ''
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  test:
    # GitHub's hosted runner: this repository is public (25 Oct 2026), and a
    # public repository never runs on our own machines — a pull request from
    # a fork would run its code there. Hosted minutes are free for public
    # repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on push to main; the supported floor only on PRs (FOL-62).
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["22", "24"]') }}
    # What FOLDRUN_TEST_DATABASE_URL and FOLDRUN_TEST_REDIS_URL point at.
    # Health-checked, so the job starts only once both answer.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: foldrun
          POSTGRES_PASSWORD: test
          POSTGRES_DB: foldrun
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U foldrun -d foldrun"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      # Full history: the migration guard diffs drizzle/ against the commit
      # this push or pull request started from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: foldrun-platform
          fetch-depth: 0
      # The sibling this package compiles against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Public, like this repository: no token, so a pull request from a
          # fork (which gets no secrets) runs the same checks.
          repository: foldrun-io/foldrun-core
          path: foldrun-core
          # The commit core's ci dispatched, or the ref asked for by hand;
          # empty is core's main.
          ref: ${{ github.event.client_payload.sha || inputs.core_ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            foldrun-platform/package-lock.json
            foldrun-core/package-lock.json
      - run: npm ci
        working-directory: foldrun-core
      - run: npm ci
        working-directory: foldrun-platform
      # Every migration added must work with the previous release's code: a
      # rollback leaves the database on the newer schema (expand/contract).
      # The base is what this push or pull request started from — CI cannot
      # read foldrun-infra's box version tags, which the pre-push hook uses.
      - name: migration guard
        run: node scripts/migration-guard.mjs
        working-directory: foldrun-platform
        env:
          MIGRATION_GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # Billing (foldrun-admin) is never committed here.
      - name: billing stays out
        run: node scripts/billing-guard.mjs HEAD
        working-directory: foldrun-platform
      - run: npx tsc --noEmit -p .
        working-directory: foldrun-platform
      # local-kms, as the box ran it, for the one test that moves account
      # keys under KMS (FOLDRUN_TEST_KMS_URL). Started here, not as a
      # service, because it needs its key made once it is up: a key and the
      # alias the test names, through the KMS API itself (local-kms checks
      # no signature), so no key material is written into this file.
      - name: local-kms
        run: |
          docker run -d --name local-kms -p 127.0.0.1:58080:8080 \
            -e KMS_REGION=ap-southeast-2 -e KMS_ACCOUNT_ID=111122223333 \
            nsmithuk/local-kms@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:58080/ && break; sleep 1; done
          kms() { curl -fsS -X POST http://127.0.0.1:58080/ -H 'content-type: application/x-amz-json-1.1' -H "x-amz-target: TrentService.$1" -d "$2"; }
          id="$(kms CreateKey '{"Description":"foldrun CI"}' | jq -r .KeyMetadata.KeyId)"
          kms CreateAlias "{\"AliasName\":\"alias/foldrun-test\",\"TargetKeyId\":\"$id\"}"
      # A real Playwright with Chromium for the one test that SIGTERMs a
      # `playwright run-server` mid-call (FOLDRUN_TEST_PLAYWRIGHT). The
      # version the runner image pins (gallery.ts); one Node leg is enough.
      - name: playwright for the browser-pod test
        if: matrix.node == '22'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p pw && cd pw
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          # The browsers in a named folder, not ~/.cache: the browse tests
          # start their programs with HOME=/tmp, where a default install is
          # not found ("Executable doesn't exist at /tmp/.cache/…").
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/browsers"
          # Firefox and certutil too: a held Firefox trusts the egress CA from
          # its profile's NSS database (tests/browse-firefox-ca.test.ts, FOL-128).
          npx --no-install playwright install --with-deps chromium firefox
          sudo apt-get install -y --no-install-recommends libnss3-tools >/dev/null
          echo "FOLDRUN_TEST_PLAYWRIGHT=$PWD" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - run: npm test
        working-directory: foldrun-platform
        env:
          FOLDRUN_TEST_DATABASE_URL: postgres://foldrun:test@127.0.0.1:55432/foldrun
          FOLDRUN_TEST_REDIS_URL: redis://127.0.0.1:56379
          FOLDRUN_TEST_KMS_URL: http://127.0.0.1:58080
          FOLDRUN_TEST_KMS_KEY: alias/foldrun-test
      # Two files run whole on Redis when FOLDRUN_REDIS_URL is set — the
      # store production uses — and on memory without it, which is how
      # npm test just ran them. Once more on Redis, for their Redis-only
      # cases and the rest on the real store.
      - name: delegate and egress role, on Redis
        run: FOLDRUN_DATA="$(mktemp -d)" node --test --test-timeout=180000 tests/delegate.test.ts tests/egress-role.test.ts
        working-directory: foldrun-platform
        env:
          FOLDRUN_REDIS_URL: redis://127.0.0.1:56379
      - name: local-kms log
        if: failure()
        run: docker logs local-kms 2>&1 | tail -50 || true
